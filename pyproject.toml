[project]
name = "qa-system"
version = "0.1.0"
description = "RAG question answering over six PDF reports with page-level citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["llm: calls Claude through the full RAG pipeline (slow)"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
